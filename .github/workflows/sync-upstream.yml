# Absorb upstream (liftaris/herm dev) while protecting the Harlow changes.
#
# Three branches carry local commits on top of upstream/dev:
#   harlow        -- the SIGUSR2 config-reload patch alone. Head of PR
#                    liftaris/herm#253, so it stays upstreamable: no local-only
#                    work goes here.
#   harlow-local  -- harlow plus local carries (Hermes contract cap). This is
#                    what scripts/install-therm.sh builds and installs.
#   dev           -- this workflow; the fork's default branch, because GitHub
#                    only fires scheduled workflows from the default branch
#
# Both are rebased rather than merged, so `git log upstream/dev..<branch>` is
# always exactly our own work: reviewable, trivial to upstream, trivial to drop.
#
# Nothing is pushed unless every guard passes. The failure this is built around
# is not a conflict -- conflicts are loud. It is a *clean* rebase that silently
# drops or neuters a patch, leaving a green branch that no longer does the
# thing it exists to do.
name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/liftaris/herm.git
  UPSTREAM_BRANCH: dev

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream "$UPSTREAM_BRANCH"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ---- harlow: the patch branch -------------------------------------
      - name: Rebase harlow
        id: harlow
        run: |
          git checkout -B harlow origin/harlow
          before=$(git log --format='%H' "upstream/$UPSTREAM_BRANCH..HEAD" | wc -l)
          if [ "$before" -eq 0 ]; then
            echo "::error::harlow carries no commits over upstream -- refusing."; exit 1
          fi
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "already up to date"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if ! git rebase "upstream/$UPSTREAM_BRANCH"; then
            git rebase --abort || true
            echo "::error::harlow rebase conflicted; branch left untouched."; exit 1
          fi
          after=$(git log --format='%H' "upstream/$UPSTREAM_BRANCH..HEAD" | wc -l)
          [ "$after" -eq "$before" ] || { echo "::error::commit count $before -> $after"; exit 1; }
          # A rebase can resolve cleanly and still leave the wiring gone if
          # upstream rewrote index.tsx. Check the call site, not just the file.
          test -f src/app/reloadSignal.ts || { echo "::error::reloadSignal.ts gone"; exit 1; }
          grep -q 'process.on(RELOAD_SIGNAL' src/app/reloadSignal.ts \
            || { echo "::error::handler no longer registered"; exit 1; }
          grep -q 'installReloadSignal()' src/index.tsx \
            || { echo "::error::index.tsx no longer calls installReloadSignal()"; exit 1; }

      - name: Verify harlow
        if: steps.harlow.outputs.changed == 'true'
        run: |
          set -o pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/reload-signal.test.ts   # behaviour, not just source text
          bun test                              # don't absorb a broken upstream

      - name: Push harlow
        if: steps.harlow.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:harlow

      # ---- harlow-local: what actually gets installed --------------------
      - name: Rebase harlow-local
        id: local
        run: |
          git checkout -B harlow-local origin/harlow-local
          before=$(git log --format='%H' "upstream/$UPSTREAM_BRANCH..HEAD" | wc -l)
          if [ "$before" -eq 0 ]; then
            echo "::error::harlow-local carries no commits over upstream -- refusing."; exit 1
          fi
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if ! git rebase "upstream/$UPSTREAM_BRANCH"; then
            git rebase --abort || true
            echo "::error::harlow-local rebase conflicted; branch left untouched."; exit 1
          fi
          after=$(git log --format='%H' "upstream/$UPSTREAM_BRANCH..HEAD" | wc -l)
          [ "$after" -eq "$before" ] || { echo "::error::commit count $before -> $after"; exit 1; }
          grep -q 'installReloadSignal()' src/index.tsx \
            || { echo "::error::index.tsx no longer calls installReloadSignal()"; exit 1; }
          # Upstream raising its own cap past ours is fine; dropping below the
          # backend's contract is what breaks prompt submission.
          grep -qE 'MAX_BACKEND_CONTRACT = ([6-9]|[1-9][0-9])' src/context/backend-contract.ts \
            || { echo "::error::MAX_BACKEND_CONTRACT fell below 6"; exit 1; }

      - name: Verify harlow-local
        if: steps.local.outputs.changed == 'true'
        run: |
          set -o pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test test/reload-signal.test.ts
          bun test test/sessionCapabilities.test.ts
          bun test

      - name: Push harlow-local
        if: steps.local.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:harlow-local

      # ---- dev: this workflow -------------------------------------------
      - name: Rebase dev
        id: devbranch
        run: |
          git checkout -B sync-dev origin/dev
          before=$(git log --format='%H' "upstream/$UPSTREAM_BRANCH..HEAD" | wc -l)
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if ! git rebase "upstream/$UPSTREAM_BRANCH"; then
            git rebase --abort || true
            echo "::error::dev rebase conflicted; branch left untouched."; exit 1
          fi
          # Never let a sync delete the thing that performs syncs.
          test -f .github/workflows/sync-upstream.yml \
            || { echo "::error::sync workflow missing after rebase"; exit 1; }
          after=$(git log --format='%H' "upstream/$UPSTREAM_BRANCH..HEAD" | wc -l)
          [ "$after" -eq "$before" ] || { echo "::error::commit count $before -> $after"; exit 1; }

      - name: Push dev
        if: steps.devbranch.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:dev

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream sync failed"
          existing=$(gh issue list --state open --search "$title in:title" --json number -q '.[0].number')
          body=$(printf '%s\n' \
            "Automated upstream sync failed. Affected branches were left untouched." \
            "" \
            "- harlow rebase+guards: \`${{ steps.harlow.outcome }}\`" \
            "- harlow-local rebase+guards: \`${{ steps.local.outcome }}\`" \
            "- dev rebase+guards: \`${{ steps.devbranch.outcome }}\`" \
            "" \
            "[Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            "" \
            "Resolve locally:" \
            '```' \
            "git fetch upstream && git checkout harlow" \
            "git rebase upstream/$UPSTREAM_BRANCH" \
            '```')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"
          else gh issue create --title "$title" --body "$body"; fi
